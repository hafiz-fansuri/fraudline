[project]
name = "fraudline"
version = "0.1.0"
description = "Reproducible fraud detection and a transaction investigation desk"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "numpy>=2,<3", "pandas>=2.2,<3", "lightgbm>=4.6,<5", "prometheus-client>=0.21,<1",
  "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
train = ["pyarrow>=19,<25", "pandera[pandas]>=0.24,<1", "scikit-learn>=1.6,<2"]
ops = ["pyarrow>=19,<25", "pandera[pandas]>=0.24,<1", "scikit-learn>=1.6,<2", "mlflow>=3,<4", "evidently>=0.7,<0.8", "dvc>=3.60,<4", "optuna>=4,<5"]
dev = ["pyarrow>=19,<25", "pandera[pandas]>=0.24,<1", "scikit-learn>=1.6,<2", "pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff]
line-length = 110
