groups:
  - name: fraudline
    rules:
      - alert: FraudlineErrorRate
        expr: sum(rate(fraudline_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(fraudline_requests_total[5m])), 0.001) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Fraudline error rate exceeds 5%"}
      - alert: FraudlineLatency
        expr: histogram_quantile(0.95, sum(rate(fraudline_request_seconds_bucket[5m])) by (le)) > 0.1
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Fraudline warm request p95 exceeds 100 ms"}
      - alert: FraudlineDataDrift
        expr: fraudline_data_drift > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Fraudline scheduled monitor detected data drift"}
